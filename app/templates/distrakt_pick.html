{% extends '_base.html' %}
{# This page's own styling lives in the bundled stylesheet, NOT in a <style>
   here. A boosted navigation swaps <body> and leaves <head> alone, so CSS a
   page carries in its own head is applied only when that page is the one the
   browser loaded cold — arrive here by clicking and the rules never exist. #}
{% set site_suffix = false %}
{% set progress_bar = true %}
{% block title %}Pick a Month{% endblock %}
{% block content %}
{% import '_nav.html' as site_nav %}
{% call site_nav.navbar(brand='distrakt',
                        calendar_available=calendar_available,
                        ranker_available=ranker_available, is_admin=is_admin) %}
{% endcall %}

    <div class="pick-wrap">
        <div class="pick-panel">
            <h1>Pick a Month</h1>
            <div class="sub">Nothing is gathered until you choose one.</div>

            {# The year arrows stay on this page — neither carries a `month`, and a
               `month` in the query is what sends this route into a month instead. #}
            <div class="year-nav">
                <a class="month-nav-btn prev" href="/distrakt?year={{ year - 1 }}" title="Previous year" aria-label="Previous year">
                    <img src="/static/images/arrow-left.png" alt="Previous year">
                </a>
                <span class="year">{{ year }}</span>
                <a class="month-nav-btn next" href="/distrakt?year={{ year + 1 }}" title="Next year" aria-label="Next year">
                    <img src="/static/images/arrow-right.png" alt="Next year">
                </a>
            </div>

            <div class="month-grid">
                {% for m in months %}
                {# Every month is a destination. Opening one gathers nothing by
                   itself, so there is nothing here to hold back: a month behind
                   the calendar shows what it holds, and one ahead shows the
                   control that builds it. #}
                <a class="month-btn{% if current_month == m.num %} current{% endif %}" href="/distrakt?month={{ m.num }}&amp;year={{ year }}">
                    {{ m.name }}
                    <span class="num">{{ year }}{% if m.tracked %} · kept{% endif %}</span>
                </a>
                {% endfor %}
            </div>

            <div class="pick-foot">
                <a class="pill-btn" href="/distrakt?month={{ today_month }}&amp;year={{ today_year }}">Go to current month →</a>
            </div>
        </div>
    </div>
{% endblock %}
