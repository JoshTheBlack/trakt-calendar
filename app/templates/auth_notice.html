{% extends '_base.html' %}
{% set body_class = 'auth-page' %}
{% set nav_head = false %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <img class="auth-logo" src="/static/images/distrakkl-wordmark.svg" alt="{{ product }}">
  <div class="auth-card">
    <h1>{{ title }}</h1>
    <p class="auth-notice">{{ message }}</p>
    <div class="auth-actions">
      <a class="btn-ghost" href="{{ back }}">{{ back_label }}</a>
    </div>
  </div>
</div>
{% endblock %}
