<!DOCTYPE html>
<html lang="en">
{% import '_head.html' as page with context %}
{{ page.head(title, nav_head=false) }}
<body class="auth-page" hx-boost="true">
<div class="auth-shell">
  <img class="auth-logo" src="/static/images/trakttop.png" alt="Trakt New Shows">
  <div class="auth-card">
    <h1>{{ title }}</h1>
    <p class="auth-notice">{{ message }}</p>
    <div class="auth-actions">
      <a class="btn-ghost" href="{{ back }}">{{ back_label }}</a>
    </div>
  </div>
</div>
</body>
</html>
