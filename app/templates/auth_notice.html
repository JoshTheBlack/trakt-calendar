<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  {# Parsed before first paint, so the gap before the stylesheet applies
     is the page's own dark rather than the browser's default white. #}
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} &ndash; Trakt New Shows</title>
  <link rel="shortcut icon" href="/static/images/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="preload" href="/static/fonts/bebas-neue-v16-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-v20-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-v20-latin-700.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="auth-page">
<div class="auth-shell">
  <img class="auth-logo" src="/static/images/trakttop.png" alt="Trakt New Shows">
  <div class="auth-card">
    <h1>{{ title }}</h1>
    <p class="auth-notice">{{ message }}</p>
    <div class="auth-actions">
      <a class="btn-ghost" href="{{ back }}">{{ back_label }}</a>
    </div>
  </div>
</div>
</body>
</html>
