<!DOCTYPE html>
<html lang="en">
{% import '_head.html' as page with context %}
{# This page's own styling lives in the bundled stylesheet, NOT in a <style>
   here. A boosted navigation swaps <body> and leaves <head> alone, so CSS a
   page carries in its own head is applied only when that page is the one the
   browser loaded cold — arrive here by clicking and the rules never exist. #}
{{ page.head('Pick a Month', scripts=assets.scripts('pick'), site_suffix=false) }}
{%- set body_class %}{% endset %}
<body class="{{ body_class }}" hx-boost="true">
{# What a boosted arrival cannot work out for itself. A swap replaces the body's
   CHILDREN, so the <body> element keeps the previous page's classes and the <head>
   keeps its scripts — see static/js/boost.js, which reads this and applies both.
   Inside the body deliberately: it has to travel with the swap, and it has to
   survive a Back, which htmx serves from its own cache with no request at all. #}
<div id="pageMeta" hidden data-page="pick" data-body-class="{{ body_class }}"></div>
    {# The shared header. The view controls (card style, day packing, timezone)
       are deliberately absent — nothing rendered here reacts to them. #}
    {% import '_nav.html' as site_nav %}
    {% macro hero_controls() %}
            <div class="control" title="{{ endpoint.description }}">
                <label for="endpointSelect">📡</label>
                <select id="endpointSelect" onchange="switchPickEndpoint(this.value)">
                    {% for ep in endpoints %}
                    <option value="{{ ep.key }}"{% if ep.key == endpoint.key %} selected{% endif %}>{{ ep.label }}</option>
                    {% endfor %}
                </select>
            </div>
    {% endmacro %}
    {% call site_nav.navbar(controls=hero_controls,
                            calendar_available=calendar_available,
                            ranker_available=ranker_available, is_admin=is_admin) %}
    {% endcall %}

    <div class="pick-wrap">
        <div class="pick-panel">
            <h1>Pick a Month</h1>
            <div class="sub">Choose a month and year to see its new show premieres.</div>

            <div class="year-nav">
                <a class="month-nav-btn prev" href="/pick?year={{ year - 1 }}&amp;endpoint={{ endpoint.key }}" title="Previous year" aria-label="Previous year">
                    <img src="/static/images/arrow-left.png" alt="Previous year">
                </a>
                <span class="year">{{ year }}</span>
                <a class="month-nav-btn next" href="/pick?year={{ year + 1 }}&amp;endpoint={{ endpoint.key }}" title="Next year" aria-label="Next year">
                    <img src="/static/images/arrow-right.png" alt="Next year">
                </a>
            </div>

            <div class="month-grid">
                {% for m in months %}
                <a class="month-btn{% if current_month == m.num %} current{% endif %}" href="/calendar?month={{ m.num }}&amp;year={{ year }}&amp;endpoint={{ endpoint.key }}">
                    {{ m.name }}
                    <span class="num">{{ year }}</span>
                </a>
                {% endfor %}
            </div>

            <div class="pick-foot">
                <a class="pill-btn" href="/calendar?month={{ today_month }}&amp;year={{ today_year }}&amp;endpoint={{ endpoint.key }}">Go to current month →</a>
            </div>
        </div>
    </div>
<script>
    // Stays on the picker rather than jumping into a month: this page is where
    // you choose one, so switching the calendar type must not also choose it.
    function switchPickEndpoint(key) {
        const params = new URLSearchParams(window.location.search);
        params.set('endpoint', key);
        params.set('year', '{{ year }}');
        window.location = '/pick?' + params.toString();
    }
</script>
</body>
</html>
