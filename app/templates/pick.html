{% extends '_base.html' %}
{# This page's own styling lives in the bundled stylesheet, NOT in a <style>
   here. A boosted navigation swaps <body> and leaves <head> alone, so CSS a
   page carries in its own head is applied only when that page is the one the
   browser loaded cold — arrive here by clicking and the rules never exist. #}
{% set site_suffix = false %}
{% set progress_bar = true %}
{% block title %}Pick a Month{% endblock %}
{% block content %}
    {# The shared header. The view controls (card style, day packing, timezone)
       are deliberately absent — nothing rendered here reacts to them. #}
    {% import '_nav.html' as site_nav %}
    {% macro hero_controls() %}
            {# A GET FORM ASKING FOR THIS PAGE AGAIN, which is all the script it
               replaced did: it built `/?endpoint=…&year=…` and navigated. It stays
               on the picker rather than jumping into a month — this page is where
               you choose one, so switching the calendar type must not also choose
               it — and it carries no `month`, because "/" reads one as a request
               for that calendar and redirects into it.

               htmx boosts a form on `submit` only, so a boosted form cannot act on
               a select's `change`. This one opts out of boosting and says the same
               thing itself: ask on change, draw the answer as the page, and put it
               in the address bar. With no htmx at all it is still a GET form. #}
            <form class="control" action="/" method="get" title="{{ endpoint.description }}"
                  hx-boost="false" hx-get="/" hx-trigger="change" hx-target="body"
                  hx-push-url="true">
                <input type="hidden" name="year" value="{{ year }}">
                <label for="endpointSelect">📡</label>
                {# See index.html: a restored value overriding the rendered
                   `selected` is unreachable on a select that acts on `change`. #}
                <select id="endpointSelect" name="endpoint" autocomplete="off" data-url-state>
                    {% for ep in endpoints %}
                    <option value="{{ ep.key }}"{% if ep.key == endpoint.key %} selected{% endif %}>{{ ep.label }}</option>
                    {% endfor %}
                </select>
            </form>
    {% endmacro %}
    {% call site_nav.navbar(controls=hero_controls,
                            calendar_available=calendar_available,
                            ranker_available=ranker_available, is_admin=is_admin) %}
    {% endcall %}

    <div class="pick-wrap">
        <div class="pick-panel">
            <h1>Pick a Month</h1>
            <div class="sub">Choose a month and year to see its new show premieres.</div>

            {# Both arrows, and the endpoint switcher at the foot of this file,
               stay on "/" — this page's one address. A `month` in the query is
               what sends that route into a calendar instead, and neither of
               these carries one. #}
            <div class="year-nav">
                <a class="month-nav-btn prev" href="/?year={{ year - 1 }}&amp;endpoint={{ endpoint.key }}" title="Previous year" aria-label="Previous year">
                    <img src="/static/images/arrow-left.png" alt="Previous year">
                </a>
                <span class="year">{{ year }}</span>
                <a class="month-nav-btn next" href="/?year={{ year + 1 }}&amp;endpoint={{ endpoint.key }}" title="Next year" aria-label="Next year">
                    <img src="/static/images/arrow-right.png" alt="Next year">
                </a>
            </div>

            <div class="month-grid">
                {% for m in months %}
                <a class="month-btn{% if current_month == m.num %} current{% endif %}" href="/calendar?month={{ m.num }}&amp;year={{ year }}&amp;endpoint={{ endpoint.key }}">
                    {{ m.name }}
                    <span class="num">{{ year }}</span>
                </a>
                {% endfor %}
            </div>

            <div class="pick-foot">
                <a class="pill-btn" href="/calendar?month={{ today_month }}&amp;year={{ today_year }}&amp;endpoint={{ endpoint.key }}">Go to current month →</a>
            </div>
        </div>
    </div>
{% include "_footer.html" %}
{% endblock %}
