<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 110">
  <defs>
    <!-- PINNED IN USER SPACE rather than left on the default objectBoundingBox
         units, which would stretch the ramp to whatever element carries it: the
         path's box is its INK, and ink starts at 6.55 here because D's left
         sidebearing is not ink. Measured against the <text> element this file
         used to be, the pinned ramp reproduces it to within single-level 8-bit
         rounding; on the default every interior pixel of the word changed. -->
    <linearGradient id="wordmarkGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="565" y2="0">
      <stop offset="0%" stop-color="#f4d385"></stop>
      <stop offset="40%" stop-color="#e8b545"></stop>
      <stop offset="100%" stop-color="#e0384d"></stop>
    </linearGradient>
  </defs>
  <!-- OUTLINED, NOT LIVE <text>, AND THE viewBox IS THE TYPE. The word used to
       be a <text> element set in Arial Black, which meant it only looked like
       the wordmark on a machine with that face installed; anywhere else the
       browser substituted, and a substituted face has different glyph widths, so
       the word changed shape AND total width. That is not a thing a brand mark
       may do, and it is invisible to anyone whose own machine has the font.

       The old box was 820 wide with the word centred inside it, which left 127.5
       units — about 39px at the 34px height every surface draws this at — of
       transparent padding on EACH side. Centred surfaces never noticed, because
       the padding was symmetric, but in the header it read as a large gap
       between the name and the month controls that no stylesheet could close:
       the space was inside the picture. The box is now the type's own box, so
       the only space either side is the outer glyphs' sidebearings, and the
       header's own 14px gap is the gap you see.

       TIGHTENING THE BOX ONLY BECAME SAFE WHEN THE TYPE STOPPED BEING LIVE. A
       viewBox measured against Arial Black's metrics would have been wrong again
       on exactly the machines that substitute; paths have no such dependency.
       Every surface sizes this by HEIGHT with width:auto (34px in the header and
       on the sign-in pages, 30px on the 404), so nothing changed size — the
       image simply stopped carrying dead space. The intrinsic width stated in
       the markup did change, 254 to 175, and it is 565/110*34 rounded.

       TO REGENERATE, if the word or its spacing ever changes: shape the runs
       "DISTRA", "KK" and "L" against Arial Black (ariblk.ttf) at font-size 86
       with letter-spacing -2, 10 and -2, which is what the old markup asked for;
       the advances sum to 565.00, which is the viewBox width, and each glyph is
       drawn from a pen starting at 0 on the baseline y=80, scaled by 86/2048
       with y flipped. Rendered against the old element at 3x device scale, all
       eight glyphs occupied the same ink columns and rows to the pixel, and the
       only differences were antialiasing along the diagonals of K, A and S. -->
