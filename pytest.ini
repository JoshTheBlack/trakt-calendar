[pytest]
testpaths = tests

# --import-mode=importlib is what lets tests/ have subdirectories at all. On the
# default "prepend" mode pytest imports each test module under its BASENAME as a
# top-level module, so tests/calendar/test_routes.py and tests/auth/test_routes.py
# would collide with "import file mismatch" — and the tree below deliberately
# repeats names like test_routes.py because the directory is what says which
# feature they belong to. importlib gives each module a name derived from its
# full path instead, so the collision cannot happen.
#
# Nothing is added to sys.path by this mode; tests/conftest.py puts the repo root
# there itself, before collection, which is also what makes `from tests.support
# import ...` work from inside a test module.
#
# -n auto runs the suite across one pytest-xdist worker per CPU. The run was
# bound to ONE core (measured: ~29% CPU on an eight-thread machine) and no test
# stood out — two thousand of them cost 0.1s or more each — so the time was the
# sum of many ordinary tests, which only more cores shorten: 10m47s alone,
# 3m03s across eight. Each worker is its own process with its own data directory
# (tests/conftest.py), which is what makes that safe. Pass -n 0 to run in one
# process, which is what a debugger or print() needs.
addopts = --import-mode=importlib -n auto

# Warnings are shown, not silenced. The suite currently emits one — Starlette
# deprecating httpx in its TestClient — and it is a real thing to act on when
# httpx2 lands, so hiding it here would only mean nobody sees it again.
filterwarnings = default
